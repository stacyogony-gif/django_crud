<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}People{% endblock %} · People Desk</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202720;
            --muted: #68746b;
            --paper: #f5f7f3;
            --surface: #fff;
            --line: #e3e9e1;
            --green: #245c43;
            --green-dark: #194632;
            --green-soft: #e8f1eb;
            --red: #a53d36;
            --shadow: 0 16px 40px rgba(32, 54, 39, .07);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--paper);
            color: var(--ink);
            font: 15px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        a { color: inherit; }
        .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
        .nav {
            width: min(1120px, calc(100% - 40px));
            min-height: 72px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; font-weight: 750; letter-spacing: -.03em; }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: var(--green);
            color: white;
            font-size: 17px;
        }
        .nav-link { color: var(--muted); font-weight: 600; text-decoration: none; }
        .nav-link:hover { color: var(--green); }
        main { width: min(1120px, calc(100% - 40px)); margin: 48px auto 72px; }
        .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
        h1, h2, p { margin-top: 0; }
        h1 { margin-bottom: 8px; font-size: clamp(30px, 4vw, 42px); line-height: 1.12; letter-spacing: -.045em; }
        h2 { margin-bottom: 8px; font-size: 22px; letter-spacing: -.025em; }
        .muted, .subtitle { color: var(--muted); }
        .subtitle { margin-bottom: 0; }
        .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
        .panel { padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 0 0 20px; }
        .search { display: flex; flex: 1; max-width: 520px; gap: 10px; }
        input, select, textarea {
            width: 100%;
            min-height: 44px;
            padding: 10px 13px;
            border: 1px solid #d5ded4;
            border-radius: 9px;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: 3px solid rgba(36, 92, 67, .18); border-color: var(--green); }
        input[type="file"] { padding: 7px; }
        label { display: block; margin-bottom: 6px; font-weight: 650; }
        .form-control { display: block; }
        form p { margin: 0 0 18px; }
        form p:has(input[type="checkbox"]) { display: flex; align-items: center; gap: 10px; }
        form p:has(input[type="checkbox"]) label { margin: 0; }
        form p:has(input[type="checkbox"]) input { width: auto; min-height: auto; }
        .helptext { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; }
        .errorlist { margin: 6px 0 0; padding-left: 18px; color: var(--red); }
        .btn {
            display: inline-flex;
            min-height: 42px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 15px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s ease, transform .15s ease;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: var(--green); color: #fff; }
        .btn-primary:hover { background: var(--green-dark); color: #fff; }
        .btn-secondary { border-color: var(--line); background: white; }
        .btn-secondary:hover { background: var(--paper); }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { background: #87302a; color: white; }
        .btn-small { min-height: 34px; padding: 6px 10px; font-size: 13px; }
        .btn-view { border-color: #bfd2ed; background: #edf5ff; color: #225a96; }
        .btn-view:hover { background: #dbeaff; color: #174978; }
        .btn-edit { border-color: #e7d09b; background: #fff7df; color: #805b12; }
        .btn-edit:hover { background: #fbedbd; color: #674708; }
        .btn-delete { border-color: #edbbb6; background: #fff0ee; color: #a53d36; }
        .btn-delete:hover { background: #f8dad6; color: #87302a; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
        td { padding: 15px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
        tbody tr:last-child td { border-bottom: 0; }
        tbody tr:hover { background: #fafcf9; }
        .person { display: flex; align-items: center; gap: 12px; min-width: 170px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--green-soft); }
        .person-name { font-weight: 700; text-decoration: none; }
        .person-name:hover { color: var(--green); }
        .actions { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .empty-state { padding: 48px 20px; text-align: center; }
        .empty-icon { display: grid; width: 54px; height: 54px; margin: 0 auto 15px; place-items: center; border-radius: 16px; background: var(--green-soft); color: var(--green); font-size: 24px; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
        .detail-item { padding: 17px 0; border-bottom: 1px solid var(--line); }
        .detail-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; }
        .detail-value { overflow-wrap: anywhere; font-weight: 650; }
        .profile { display: flex; align-items: center; gap: 18px; margin-bottom: 12px; }
        .profile .avatar { width: 72px; height: 72px; }
        .confirm-icon { display: grid; width: 52px; height: 52px; margin-bottom: 18px; place-items: center; border-radius: 15px; background: #fbefed; color: var(--red); font-size: 24px; }
        .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
        @media (max-width: 680px) {
            .nav, main { width: min(100% - 28px, 1120px); }
            main { margin-top: 32px; }
            .page-heading, .toolbar { align-items: stretch; flex-direction: column; }
            .page-heading .btn { align-self: flex-start; }
            .panel { padding: 20px; }
            .search { max-width: none; }
            .detail-grid { grid-template-columns: 1fr; }
            .hide-mobile { display: none; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <header class="topbar">
        <nav class="nav" aria-label="Main navigation">
            <a class="brand" href="{% url 'user_list' %}">
                <span class="brand-mark" aria-hidden="true">P</span>
                <span>People Desk</span>
            </a>
            <a class="nav-link" href="{% url 'user_list' %}">People</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
