{% extends "base.html" %}

{% block title %}Add a person{% endblock %}

{% block content %}
<p class="eyebrow"><a href="{% url 'user_list' %}">People</a> / New record</p>
<section class="panel" style="max-width: 680px; margin: 20px auto;">
    <h1>Add a person</h1>
    <p class="subtitle" style="margin-bottom: 28px;">Enter their details below. You can update this record at any time.</p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save person</button>
            <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
